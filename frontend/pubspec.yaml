name: frontend
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  shared_preferences: ^2.5.5
  provider: ^6.1.5+1
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Configuración del ícono de la aplicación
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/nexus9_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/backgrounds/loading_screen.png
    - assets/backgrounds/menu_game.png
    - assets/backgrounds/tutorial.png
    - assets/backgrounds/options_game.png
    - assets/audio/background_music.mp3